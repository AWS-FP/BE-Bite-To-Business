# Kết nối Supabase production; thông tin đăng nhập lấy từ biến môi trường.
spring.datasource.url=${SUPABASE_DB_URL}
spring.datasource.username=${SUPABASE_DB_USERNAME}
spring.datasource.password=${SUPABASE_DB_PASSWORD}

# Giới hạn connection pool theo cấu hình deploy.
spring.datasource.hikari.pool-name=mdfoods-prod-hikari
spring.datasource.hikari.maximum-pool-size=${SPRING_DATASOURCE_HIKARI_MAXIMUM_POOL_SIZE:4}
spring.datasource.hikari.minimum-idle=${SPRING_DATASOURCE_HIKARI_MINIMUM_IDLE:0}
spring.datasource.hikari.connection-timeout=30000


# Mức log production.
logging.level.root=INFO

# Production mặc định tắt Swagger; có thể bật qua biến môi trường.
springdoc.api-docs.enabled=${SPRINGDOC_API_DOCS_ENABLED:false}
springdoc.swagger-ui.enabled=${SPRINGDOC_SWAGGER_UI_ENABLED:false}
app.docs.public-enabled=${APP_DOCS_PUBLIC_ENABLED:false}

# Thông tin Gmail lấy từ biến môi trường bảo mật.
spring.mail.username=${SPRING_MAIL_USERNAME}
spring.mail.password=${SPRING_MAIL_PASSWORD}

app.frontend-base-url=${APP_FRONTEND_BASE_URL}
app.backend-base-url=${APP_BACKEND_BASE_URL}
