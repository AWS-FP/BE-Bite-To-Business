<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<!--/*
    Khung chung cho mọi email của website: nền trắng, viền xám, logo nhỏ, một màu nhấn xanh đậm.
    Lambda btb-customer-notifier (aws-lambda/btb-customer-notifier/index.mjs) dùng cùng khung này;
    sửa giao diện ở đây thì sửa cả bên đó cho đồng bộ.
    Biến cần có: websiteUrl, supportEmail (có thể rỗng).
*/-->
<body>
<table role="presentation">
    <tr th:fragment="header">
        <td style="padding:20px 32px;border-bottom:1px solid #e4e4e7;">
            <a th:href="${websiteUrl}" href="https://bite2business.cloud" style="text-decoration:none;">
                <table role="presentation" cellpadding="0" cellspacing="0" border="0">
                    <tr>
                        <td valign="middle" style="padding-right:12px;">
                            <img th:src="|${websiteUrl}/images/email/brand-logo.png|"
                                 src="https://bite2business.cloud/images/email/brand-logo.png"
                                 width="60" height="40" alt="Bite to Business"
                                 style="display:block;width:60px;height:40px;border:0;">
                        </td>
                        <td valign="middle" style="color:#18181b;font-size:17px;line-height:24px;font-weight:bold;">
                            Bite to Business
                        </td>
                    </tr>
                </table>
            </a>
        </td>
    </tr>

    <tr th:fragment="footer(note)">
        <td style="padding:20px 32px;border-top:1px solid #e4e4e7;color:#71717a;font-size:12px;line-height:19px;">
            <p th:if="${note != null and !#strings.isEmpty(note)}" th:text="${note}" style="margin:0 0 8px;">Ghi chú</p>
            <p style="margin:0 0 8px;">Đây là email tự động từ Bite to Business, vui lòng không trả lời email này.</p>
            <p style="margin:0;">
                <a th:href="${websiteUrl}" href="https://bite2business.cloud" style="color:#123b2e;text-decoration:underline;">Website</a>
                <th:block th:if="${supportEmail != null and !#strings.isEmpty(supportEmail)}">
                    &nbsp;·&nbsp;
                    <a th:href="|mailto:${supportEmail}|" href="mailto:support@example.com" style="color:#123b2e;text-decoration:underline;">Liên hệ hỗ trợ</a>
                </th:block>
            </p>
        </td>
    </tr>
</table>
</body>
</html>
