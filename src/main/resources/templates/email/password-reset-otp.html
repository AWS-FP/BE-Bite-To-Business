<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="color-scheme" content="light">
    <title>Đặt lại mật khẩu | Bite to Business</title>
</head>
<body style="margin:0;padding:0;background-color:#f4f4f5;color:#18181b;font-family:Arial,Helvetica,sans-serif;">
<div style="display:none;font-size:1px;line-height:1px;max-height:0;max-width:0;overflow:hidden;">Dùng mã xác minh để đặt lại mật khẩu.</div>
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="background-color:#f4f4f5;">
    <tr>
        <td align="center" style="padding:24px 12px;">
            <table role="presentation" width="560" cellpadding="0" cellspacing="0" border="0"
                   style="width:100%;max-width:560px;background-color:#ffffff;border:1px solid #e4e4e7;border-radius:8px;">
                <tr th:replace="~{email/fragments/brand :: header}"></tr>
                <tr>
                    <td style="padding:28px 32px;color:#3f3f46;font-size:15px;line-height:24px;">
                        <h1 style="margin:0 0 16px;color:#18181b;font-size:20px;line-height:28px;">Đặt lại mật khẩu</h1>
                        <p style="margin:0 0 16px;">Xin chào bạn,</p>
                        <p style="margin:0 0 16px;">Nhập mã dưới đây để đặt lại mật khẩu tài khoản của bạn.</p>
                        <!--/* Không đưa mã OTP vào dòng xem trước để tránh lộ mã trên thông báo. */-->
                        <div style="padding:16px 20px;background-color:#f4f4f5;border-radius:6px;margin:0 0 16px;text-align:center;">
                            <p style="margin:0 0 6px;color:#71717a;font-size:12px;font-weight:bold;">MÃ ĐẶT LẠI MẬT KHẨU</p>
                            <p th:text="${otp}" style="margin:0;color:#18181b;font-family:'Courier New',monospace;font-size:30px;line-height:40px;font-weight:bold;letter-spacing:5px;">123456</p>
                            <p style="margin:6px 0 0;color:#71717a;font-size:13px;">Có hiệu lực <strong th:text="|${expiresInMinutes} phút|">10 phút</strong> kể từ khi gửi.</p>
                        </div>
                        <p style="margin:0;color:#71717a;font-size:13px;">Không chia sẻ mã này với bất kỳ ai. Nếu bạn không yêu cầu đặt lại mật khẩu, hãy bỏ qua email này.</p>
                    </td>
                </tr>
                <tr th:replace="~{email/fragments/brand :: footer(note='Bite to Business không bao giờ gửi mật khẩu qua email.')}"></tr>
            </table>
        </td>
    </tr>
</table>
</body>
</html>
