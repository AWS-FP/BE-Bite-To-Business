spring.application.name=Generate-UI-BE

# Mặc định dùng profile local; production đặt SPRING_PROFILES_ACTIVE.
spring.profiles.active=${SPRING_PROFILES_ACTIVE:local}

# Chờ IDE chép xong class trước khi DevTools khởi động lại ứng dụng.
spring.devtools.restart.poll-interval=3s
spring.devtools.restart.quiet-period=2s

# Domain FE được phép gọi API; nhiều domain cách nhau bằng dấu phẩy.
app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:http://localhost:5173}
# Bearer token qua Authorization; bật khi triển khai xác thực bằng cookie.
app.cors.allow-credentials=${APP_CORS_ALLOW_CREDENTIALS:false}
app.cors.max-age=${APP_CORS_MAX_AGE:3600}

# Driver dùng chung. URL/username/password ở application-local.properties hoặc application-prod.properties.
spring.datasource.driver-class-name=org.postgresql.Driver

# Supabase Auth cấp token; Spring xác minh bằng public JWKS.
spring.security.oauth2.resourceserver.jwt.issuer-uri=${SUPABASE_AUTH_ISSUER:https://retniektrltcpakqixhx.supabase.co/auth/v1}
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=${SUPABASE_AUTH_JWK_SET_URI:https://retniektrltcpakqixhx.supabase.co/auth/v1/.well-known/jwks.json}
spring.security.oauth2.resourceserver.jwt.audiences=authenticated
# Supabase dùng khóa ECC (ES256); hỗ trợ cả RSA khi xoay khóa.
spring.security.oauth2.resourceserver.jwt.jws-algorithms=ES256,RS256

# API Supabase Auth; secret key chỉ dùng ở backend để tạo tài khoản và OTP.
app.supabase.url=${SUPABASE_URL:https://retniektrltcpakqixhx.supabase.co}
app.supabase.publishable-key=${SUPABASE_PUBLISHABLE_KEY:}
app.supabase.secret-key=${SUPABASE_SECRET_KEY:}

# Cloudinary: local có thể ghi đè trong application-local.properties.
app.cloudinary.cloud-name=${CLOUDINARY_CLOUD_NAME:}
app.cloudinary.api-key=${CLOUDINARY_API_KEY:}
app.cloudinary.api-secret=${CLOUDINARY_API_SECRET:}
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB

# SePay BIDV: cấu hình ở local hoặc qua biến môi trường.
app.sepay.bank-account=${SEPAY_BANK_ACCOUNT:}
app.sepay.virtual-account=${SEPAY_VIRTUAL_ACCOUNT:}
app.sepay.webhook-secret=${SEPAY_WEBHOOK_SECRET:}

app.auth.otp-max-age=10m
app.auth.otp-resend-cooldown=60s
app.auth.password-setup-ttl=10m
app.frontend.base-url=${APP_FRONTEND_BASE_URL:http://localhost:5173}
spring.jpa.open-in-view=false

# Flyway quản lý schema bằng các file SQL trong db/migration.
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.validate-on-migrate=true
spring.flyway.validate-migration-naming=true
spring.flyway.clean-disabled=true
spring.flyway.baseline-on-migrate=false
# Baseline 0 để migration đầu tiên V1 vẫn được chạy.
spring.flyway.baseline-version=0
spring.flyway.out-of-order=false

# Hibernate không tự tạo hoặc sửa schema.
spring.jpa.hibernate.ddl-auto=none

# Chưa tích hợp AI: chạy BE không cần Gemini key; bật google-genai khi triển khai AI.
spring.ai.model.chat=${SPRING_AI_MODEL_CHAT:none}
app.bedrock.region=${BEDROCK_REGION:ap-southeast-1}
app.bedrock.model-id=${BEDROCK_MODEL_ID:apac.amazon.nova-pro-v1:0}
# Bedrock ở tài khoản AWS riêng: ARN role cần assume (để trống = dùng credentials mặc định).
app.bedrock.assume-role-arn=${BEDROCK_ASSUME_ROLE_ARN:}
app.bedrock.external-id=${BEDROCK_EXTERNAL_ID:}
spring.ai.model.embedding.text=${SPRING_AI_MODEL_EMBEDDING_TEXT:none}
spring.ai.model.image=${SPRING_AI_MODEL_IMAGE:none}
# Starter còn khởi tạo kết nối image/embedding khi model tắt; bỏ qua tới lúc tích hợp.
spring.autoconfigure.exclude=${SPRING_AUTOCONFIGURE_EXCLUDE:org.springframework.ai.model.google.genai.autoconfigure.image.GoogleGenAiImageConnectionAutoConfiguration,org.springframework.ai.model.google.genai.autoconfigure.embedding.GoogleGenAiEmbeddingConnectionAutoConfiguration}

# Swagger UI và tài liệu API cho local.
springdoc.api-docs.enabled=${SPRINGDOC_API_DOCS_ENABLED:true}
springdoc.swagger-ui.enabled=${SPRINGDOC_SWAGGER_UI_ENABLED:true}
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.tags-sorter=alpha
springdoc.swagger-ui.operations-sorter=method
springdoc.swagger-ui.doc-expansion=none
springdoc.swagger-ui.display-request-duration=true
app.docs.public-enabled=${APP_DOCS_PUBLIC_ENABLED:true}

# Cấu hình Gmail SMTP
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.default-encoding=UTF-8
spring.mail.properties[mail.smtp.auth]=true
spring.mail.properties[mail.smtp.starttls.enable]=true
spring.mail.properties[mail.smtp.starttls.required]=true
spring.mail.properties[mail.smtp.connectiontimeout]=5000
spring.mail.properties[mail.smtp.timeout]=3000
spring.mail.properties[mail.smtp.writetimeout]=5000

# Transactional outbox (V35): ghi event cùng transaction nghiệp vụ, relay đẩy lên SQS/EventBridge.
# Mặc định tắt hết để local chạy không cần AWS. Production bật qua biến môi trường của ECS task.
app.outbox.enabled=${APP_OUTBOX_ENABLED:false}
app.outbox.default-destination=${APP_OUTBOX_DEFAULT_DESTINATION:SQS}
app.outbox.aws-region=${APP_OUTBOX_AWS_REGION:${AWS_REGION:ap-southeast-1}}
app.outbox.retention-days=${APP_OUTBOX_RETENTION_DAYS:14}
app.outbox.relay.enabled=${APP_OUTBOX_RELAY_ENABLED:false}
app.outbox.relay.poll-ms=${APP_OUTBOX_RELAY_POLL_MS:2000}
app.outbox.relay.batch-size=${APP_OUTBOX_RELAY_BATCH_SIZE:20}
app.outbox.relay.stale-claim-seconds=300
app.outbox.sqs.enabled=${APP_OUTBOX_SQS_ENABLED:false}
app.outbox.sqs.queue-url=${APP_OUTBOX_SQS_QUEUE_URL:}
app.outbox.eventbridge.enabled=${APP_OUTBOX_EVENTBRIDGE_ENABLED:false}
app.outbox.eventbridge.bus-name=${APP_OUTBOX_EVENTBRIDGE_BUS_NAME:default}
app.outbox.eventbridge.source=${APP_OUTBOX_EVENTBRIDGE_SOURCE:bitetobusiness.backend}
