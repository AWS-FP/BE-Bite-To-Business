spring.application.name=Generate-UI-BE

# Mặc định dùng profile local; production đặt SPRING_PROFILES_ACTIVE.
spring.profiles.active=${SPRING_PROFILES_ACTIVE:local}

# Cấu hình database dùng chung; thông tin kết nối nằm trong từng profile.
spring.datasource.driver-class-name=org.postgresql.Driver

# Supabase Auth cấp token; Spring xác minh bằng public JWKS.
spring.security.oauth2.resourceserver.jwt.issuer-uri=${SUPABASE_AUTH_ISSUER:https://retniektrltcpakqixhx.supabase.co/auth/v1}
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=${SUPABASE_AUTH_JWK_SET_URI:https://retniektrltcpakqixhx.supabase.co/auth/v1/.well-known/jwks.json}

# Flyway quản lý schema bằng các file SQL trong db/migration.
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.validate-on-migrate=true
spring.flyway.validate-migration-naming=true
spring.flyway.clean-disabled=true
spring.flyway.baseline-on-migrate=false
spring.flyway.out-of-order=false

# Hibernate không tự tạo hoặc sửa schema.
spring.jpa.hibernate.ddl-auto=none

# Swagger UI và tài liệu API cho local.
springdoc.api-docs.enabled=${SPRINGDOC_API_DOCS_ENABLED:true}
springdoc.swagger-ui.enabled=${SPRINGDOC_SWAGGER_UI_ENABLED:true}
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.tags-sorter=alpha
springdoc.swagger-ui.operations-sorter=method
springdoc.swagger-ui.doc-expansion=none
springdoc.swagger-ui.display-request-duration=true
app.docs.public-enabled=${APP_DOCS_PUBLIC_ENABLED:true}

# Cấu hình Gmail SMTP
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.properties[mail.smtp.auth]=true
spring.mail.properties[mail.smtp.starttls.enable]=true
spring.mail.properties[mail.smtp.starttls.required]=true
spring.mail.properties[mail.smtp.connectiontimeout]=5000
spring.mail.properties[mail.smtp.timeout]=3000
spring.mail.properties[mail.smtp.writetimeout]=5000
