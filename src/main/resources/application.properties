spring.application.name=Generate-UI-BE

# Mặc định dùng profile local; production đặt SPRING_PROFILES_ACTIVE.
spring.profiles.active=${SPRING_PROFILES_ACTIVE:local}

# Domain FE được phép gọi API; nhiều domain cách nhau bằng dấu phẩy.
app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:http://localhost:5173}
# Bearer token qua Authorization; bật khi triển khai xác thực bằng cookie.
app.cors.allow-credentials=${APP_CORS_ALLOW_CREDENTIALS:false}
app.cors.max-age=${APP_CORS_MAX_AGE:3600}

# Driver dùng chung. URL/username/password ở application-local.properties hoặc application-prod.properties.
spring.datasource.driver-class-name=org.postgresql.Driver

# Supabase Auth cấp token; Spring xác minh bằng public JWKS.
spring.security.oauth2.resourceserver.jwt.issuer-uri=${SUPABASE_AUTH_ISSUER:https://retniektrltcpakqixhx.supabase.co/auth/v1}
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=${SUPABASE_AUTH_JWK_SET_URI:https://retniektrltcpakqixhx.supabase.co/auth/v1/.well-known/jwks.json}
spring.security.oauth2.resourceserver.jwt.audiences=authenticated
# Supabase dùng khóa ECC (ES256); hỗ trợ cả RSA khi xoay khóa.
spring.security.oauth2.resourceserver.jwt.jws-algorithms=ES256,RS256

# API Supabase Auth; secret key chỉ dùng ở backend để tạo tài khoản và OTP.
app.supabase.url=${SUPABASE_URL:https://retniektrltcpakqixhx.supabase.co}
app.supabase.publishable-key=${SUPABASE_PUBLISHABLE_KEY:}
app.supabase.secret-key=${SUPABASE_SECRET_KEY:}
app.auth.otp-max-age=10m
app.auth.otp-resend-cooldown=60s
app.auth.password-setup-ttl=10m
app.frontend.base-url=${APP_FRONTEND_BASE_URL:http://localhost:5173}
spring.jpa.open-in-view=false

# Flyway quản lý schema bằng các file SQL trong db/migration.
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.validate-on-migrate=true
spring.flyway.validate-migration-naming=true
spring.flyway.clean-disabled=true
spring.flyway.baseline-on-migrate=false
# Baseline 0 để migration đầu tiên V1 vẫn được chạy.
spring.flyway.baseline-version=0
spring.flyway.out-of-order=false

# Hibernate không tự tạo hoặc sửa schema.
spring.jpa.hibernate.ddl-auto=none

# Chưa tích hợp AI: chạy BE không cần Gemini key; bật google-genai khi triển khai AI.
spring.ai.model.chat=${SPRING_AI_MODEL_CHAT:none}
spring.ai.model.embedding.text=${SPRING_AI_MODEL_EMBEDDING_TEXT:none}
spring.ai.model.image=${SPRING_AI_MODEL_IMAGE:none}
# Starter còn khởi tạo kết nối image/embedding khi model tắt; bỏ qua tới lúc tích hợp.
spring.autoconfigure.exclude=${SPRING_AUTOCONFIGURE_EXCLUDE:org.springframework.ai.model.google.genai.autoconfigure.image.GoogleGenAiImageConnectionAutoConfiguration,org.springframework.ai.model.google.genai.autoconfigure.embedding.GoogleGenAiEmbeddingConnectionAutoConfiguration}

# Swagger UI và tài liệu API cho local.
springdoc.api-docs.enabled=${SPRINGDOC_API_DOCS_ENABLED:true}
springdoc.swagger-ui.enabled=${SPRINGDOC_SWAGGER_UI_ENABLED:true}
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.tags-sorter=alpha
springdoc.swagger-ui.operations-sorter=method
springdoc.swagger-ui.doc-expansion=none
springdoc.swagger-ui.display-request-duration=true
app.docs.public-enabled=${APP_DOCS_PUBLIC_ENABLED:true}

# Cấu hình Gmail SMTP
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.default-encoding=UTF-8
spring.mail.properties[mail.smtp.auth]=true
spring.mail.properties[mail.smtp.starttls.enable]=true
spring.mail.properties[mail.smtp.starttls.required]=true
spring.mail.properties[mail.smtp.connectiontimeout]=5000
spring.mail.properties[mail.smtp.timeout]=3000
spring.mail.properties[mail.smtp.writetimeout]=5000
